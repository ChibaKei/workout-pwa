<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#DD2476"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Stylized Dumbbell / Workout Symbol -->
  <g transform="rotate(-35 256 256)" filter="url(#glow)">
    <!-- Center Bar -->
    <rect x="156" y="240" width="200" height="32" rx="16" fill="url(#barGrad)"/>
    
    <!-- Left Inner Collar -->
    <rect x="176" y="216" width="16" height="80" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <!-- Left Weight Plate Big -->
    <rect x="136" y="180" width="32" height="152" rx="14" fill="url(#accentGrad)"/>
    <!-- Left Weight Plate Small -->
    <rect x="100" y="204" width="28" height="104" rx="12" fill="url(#accentGrad)"/>

    <!-- Right Inner Collar -->
    <rect x="320" y="216" width="16" height="80" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <!-- Right Weight Plate Big -->
    <rect x="344" y="180" width="32" height="152" rx="14" fill="url(#accentGrad)"/>
    <!-- Right Weight Plate Small -->
    <rect x="384" y="204" width="28" height="104" rx="12" fill="url(#accentGrad)"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M 256 70 Q 256 120 230 120 Q 256 120 256 170 Q 256 120 282 120 Q 256 120 256 70 Z" fill="#FDE047" opacity="0.9"/>
</svg>
