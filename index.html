<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>筋トレメニュー選定</title>

  <!-- PWA & Mobile Web App Settings -->
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="筋トレ選定">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top-row">
        <div class="logo-badge">
          <img src="icons/favicon.svg" alt="" class="logo-icon">
          <span class="badge-text">Workout</span>
        </div>
        <button type="button" id="btnOpenManageModal" class="btn-manage-trigger">
          <span aria-hidden="true">⚙️</span>
          <span>動画管理</span>
        </button>
      </div>
      <h1 class="app-title">筋トレメニュー選定</h1>
    </header>

    <!-- Main Workout Action Card -->
    <main class="workout-card">
      <!-- Initial State (Before Pick) -->
      <section id="emptyState" class="empty-state">
        <div class="empty-icon-wrapper" aria-hidden="true">⚡</div>
        <button type="button" id="btnPickInitial" class="btn-primary">
          <span>メニューを選ぶ</span>
          <span aria-hidden="true">🎲</span>
        </button>
      </section>

      <!-- Video Selected State -->
      <section id="videoStage" class="video-stage hidden">
        <div class="video-tags">
          <span id="videoDuration" class="tag-badge tag-duration">⏱️ -分</span>
        </div>

        <h2 id="videoTitle" class="video-title"></h2>

        <!-- YouTube Embed Player -->
        <div class="player-container">
          <div id="playerHost"></div>
        </div>

        <!-- Secondary Action Buttons -->
        <div class="action-group">
          <div class="secondary-actions-row">
            <button type="button" id="btnPickAgain" class="btn-primary">
              <span>別のメニューにする</span>
              <span aria-hidden="true">🔄</span>
            </button>
            <a id="linkOpenYoutube" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary">
              <span>YouTubeで開く</span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </section>

      <!-- Shuffling Roulette Animation Overlay -->
      <div id="rouletteOverlay" class="roulette-overlay hidden" aria-hidden="true">
        <div class="roulette-spinner"></div>
        <div id="rouletteTicker" class="roulette-title-ticker"></div>
      </div>
    </main>

    <!-- Playlist Drawer / Accordion -->
    <nav class="playlist-accordion">
      <details>
        <summary class="accordion-summary">
          <span style="display: flex; align-items: center; gap: 6px;">
            <span aria-hidden="true">📋</span>
            <span>メニュー一覧</span>
          </span>
          <span style="display: flex; align-items: center; gap: 8px;">
            <span id="playlistCount" class="badge-text" style="color: var(--text-dim); text-transform: none;"></span>
            <span class="accordion-icon" aria-hidden="true">▼</span>
          </span>
        </summary>
        <div id="playlistItems" class="playlist-items"></div>
      </details>
    </nav>

    <!-- Video Management Modal -->
    <div id="manageModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-card">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span aria-hidden="true" style="font-size: 1.2rem;">⚙️</span>
            <h2 id="modalTitle" class="modal-title">動画管理</h2>
          </div>
          <button type="button" id="btnCloseManageModal" class="btn-modal-close" aria-label="閉じる">✕</button>
        </div>

        <div class="modal-body">
          <!-- Add Video Form -->
          <form id="addVideoForm" class="add-video-form">
            <div class="form-group">
              <label for="inputVideoUrl" class="form-label">YouTube URL</label>
              <div class="url-input-container">
                <input type="text" id="inputVideoUrl" class="form-input" placeholder="URLを貼り付け" required autocomplete="off">
                <button type="button" id="btnPasteUrl" class="btn-paste">
                  <span aria-hidden="true">📋</span>
                  <span>貼付</span>
                </button>
              </div>
              <div id="urlFeedback" class="url-feedback hidden"></div>
            </div>

            <div class="form-group">
              <label for="inputVideoTitle" class="form-label">タイトル</label>
              <input type="text" id="inputVideoTitle" class="form-input" placeholder="自動取得（編集可）">
            </div>

            <button type="submit" id="btnAddVideo" class="btn-primary" style="padding: 12px 16px; font-size: 0.95rem;">
              <span>追加する</span>
              <span aria-hidden="true">➕</span>
            </button>
          </form>

          <!-- Current Video List -->
          <div class="manage-list-section">
            <div class="manage-list-header">
              <h3 class="form-section-title" id="manageListTitle">登録中の動画</h3>
              <button type="button" id="btnResetVideos" class="btn-reset-link">
                初期リストに戻す
              </button>
            </div>
            <div id="manageVideoList" class="manage-video-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Scripts: videos.js then app.js -->
  <script src="js/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
